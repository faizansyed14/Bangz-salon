<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script src="../js/version.js"></script>
    <title>Expenses - BangzSalon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="header">
        <div class="header-logo-container">
            <div class="bangzsalon-logo">BangzSalon</div>
        </div>
        <nav class="nav">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="workers.html" class="nav-item">Employees</a>
            <a href="services.html" class="nav-item">Services</a>
            <a href="calendar.html" class="nav-item">Calendar</a>
            <a href="expenses.html" class="nav-item active">Expenses</a>
            <a href="salary.html" class="nav-item">Salary</a>
            <div class="nav-actions">
                <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" title="Switch to Dark Mode">🌙</button>
                <button class="btn btn-secondary btn-block" onclick="clearUser()">Logout</button>
            </div>
        </nav>
        <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <nav class="nav-mobile">
        <div class="nav-logo">
            <div class="bangzsalon-logo" style="font-size: 20px; padding: 0;">BangzSalon</div>
        </div>
        <a href="dashboard.html" class="nav-item">Dashboard</a>
        <a href="workers.html" class="nav-item">Employees</a>
        <a href="services.html" class="nav-item">Services</a>
        <a href="calendar.html" class="nav-item">Calendar</a>
        <a href="expenses.html" class="nav-item active">Expenses</a>
        <a href="salary.html" class="nav-item">Salary</a>
        <div class="nav-actions">
            <button id="themeToggleMobile" class="theme-toggle" onclick="toggleTheme()" title="Switch to Dark Mode" style="width: 100%; margin-bottom: 8px;">🌙</button>
            <button class="btn btn-secondary btn-block" onclick="clearUser()">Logout</button>
        </div>
    </nav>
    <div class="nav-overlay"></div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Add expense</h2>
            </div>
            <p style="color: var(--text-secondary); margin-bottom: 20px; font-size: 14px;">
                Log salon expenses (no staff attribution). Uses today’s date in GST, same as sales entries.
            </p>
            <form id="expenseForm" class="form-grid">
                <div class="form-group">
                    <label for="expenseType">Expense *</label>
                    <select id="expenseType" name="expenseType" required>
                        <option value="">Choose expense</option>
                        <option value="tea">Tea</option>
                        <option value="tea_cups">Tea cups</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group" id="expenseCustomWrap" style="display: none;">
                    <label for="expenseCustomName">Expense name *</label>
                    <input type="text" id="expenseCustomName" name="expenseCustomName" placeholder="Describe the expense" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="expenseAmount">Amount (AED) *</label>
                    <input type="number" id="expenseAmount" name="expenseAmount" required placeholder="0.00">
                </div>
                <div class="form-actions" style="grid-column: 1 / -1;">
                    <button type="submit" class="btn btn-primary">Save expense</button>
                </div>
            </form>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Recent expenses</h2>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Expense</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="recentExpensesBody">
                        <tr>
                            <td colspan="3" style="text-align: center; padding: 24px; color: var(--text-secondary);">Loading…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/expenses-page.js"></script>
</body>
</html>
